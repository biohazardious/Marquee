name: Idea
description: Something Marquee could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation first; a solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
