# Marquee, next to the qBittorrent it drives.
#
# Copy .env.example to .env and point the three paths at your own folders before
# bringing this up. The one thing to get right is that DOWNLOADS must be the same
# files qBittorrent writes to; when it cannot be the same path, set a remote path
# mapping in Settings -> Download client instead.
services:
  marquee:
    # The published image; `docker compose pull` gets it. `build: .` stays so a
    # checkout can still build its own with `docker compose build`.
    image: biohazardious/marquee:latest
    build: .
    container_name: marquee
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Optional. Left empty, a key is generated on the first start and kept in
      # /config/api_key; the first log line shows the URL with it.
      - MARQUEE_API_KEY=${MARQUEE_API_KEY:-}
    volumes:
      - ${CONFIG:-./config}:/config
      - ${DOWNLOADS:-./downloads}:/downloads
      - ${LIBRARY:-./library}:/library
    ports:
      - "${PORT:-8585}:8585"
    restart: unless-stopped
